# Render blueprint for BookVault.
#
# Secrets are NOT stored here. MONGODB_URI is declared with sync: false, which
# makes Render prompt for it in the dashboard instead of reading it from git.
services:
  - type: web
    name: bookvault
    runtime: python
    plan: free
    region: singapore          # closest Render region to the Mumbai Atlas cluster
    buildCommand: pip install -r requirements.txt
    # One worker, many threads. Each open change-stream connection (the
    # Activity tab) holds a thread for as long as the browser stays connected,
    # so a sync worker would block after a single viewer. A single process also
    # keeps the in-memory MongoClient pool simple.
    startCommand: >-
      gunicorn app.main:app
      --worker-class gthread
      --workers 1
      --threads 16
      --timeout 120
      --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: DB_NAME
        value: bookvault
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET
        generateValue: true     # Render creates a random secret; never reused from local
      - key: MONGODB_URI
        sync: false             # you paste this in the Render dashboard
